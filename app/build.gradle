plugins {
    id 'com.android.application'
}

// 版本号只认 version.properties，和 build.sh 同源
def props = new Properties()
file("$rootDir/version.properties").withInputStream { props.load(it) }

android {
    namespace 'com.nuonuo.folia'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nuonuo.folia'
        minSdk props['MIN_SDK'] as int
        targetSdk props['TARGET_SDK'] as int
        versionCode props['VERSION_CODE'] as int
        versionName props['VERSION_NAME']
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

// 零依赖：不用 androidx / material
dependencies {
}
